<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status | Notes from the Overground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="./oneko/oneko.js"></script>
  <nav>
    <div class="nav-left">
      <a href="./index.html">Home</a>
      <a href="./blog.html">Blog</a>
      <a href="./projects.html">Projects</a>
      <a href="./oss.html">OSS</a>
      <a href="./journal.html">Journal</a>
      <a href="./status.html" class="active">Status</a>
      <a href="./botched_hemline.html">botched_hemline</a>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-toggle-text">DARK MODE</span>
    </button>
  </nav>

  <header>
    <h1>Status</h1>
  </header>

  <main>
    <article>
      <section id="intro">
        <p>Welcome to my status board - a kanban-style view of what I'm currently working on, what's up next, and what I've recently completed.</p>
        <p>This page will be updated regularly to reflect my current projects, learning goals, and ongoing work.</p>
      </section>
    </article>
  </main>

  <script>
    // Dark mode toggle functionality
    const themeToggle = document.getElementById('theme-toggle');
    const themeText = document.querySelector('.theme-toggle-text');
    const body = document.body;

    // Check for saved theme preference or default to light mode
    const currentTheme = localStorage.getItem('theme') || 'light';
    body.setAttribute('data-theme', currentTheme);
    updateText(currentTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateText(newTheme);
    });

    function updateText(theme) {
      themeText.textContent = theme === 'dark' ? 'LIGHT MODE' : 'DARK MODE';
    }
  </script>
</body>
</html>
